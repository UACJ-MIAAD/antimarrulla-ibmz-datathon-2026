name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tests, artifacts and model reproduction
        run: make verify PY=python3.12
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside Ubuntu 24.04 using the s390x apt dependency route
        run: make verify-docker
      - name: Run the container demo and smoke test
        run: make demo-docker
