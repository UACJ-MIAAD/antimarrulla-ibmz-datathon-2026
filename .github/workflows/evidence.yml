name: evidence
on:
  push:
    branches: ["evidence/**"]
  pull_request:
    paths: ["submission/evidence/runs/**", "tools/evidence.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate recorded evidence runs (s390x, logs, hashes, provenance, secrets)
        run: PYTHONPATH=src python3 tools/evidence.py check --github-summary ${{ github.event_name == 'push' && '--require-runs' || '' }}
