<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 646" role="img" aria-labelledby="title desc">
<title id="title">Operational database: the encrypted vault</title><desc id="desc">The implemented operational store is an append-only JSONL file, not a relational database. Every saved evaluation has an encrypted payload.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b8cd"/></marker></defs>
<rect width="1040" height="646" fill="#10141e" rx="16"/>
<path d="M480 104 H560" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M785 180 V230" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M560 306 H480" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M255 382 V432" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<g transform="translate(30 28)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">Hospital payload / in memory</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">synthetic, profile, input (21 fields)</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">probability, risk_high, date</text>
</g>
<g transform="translate(560 28)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">AES-256-GCM encryption</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">External 32-byte vault key</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Random 12-byte nonce; AAD = ID</text>
</g>
<g transform="translate(560 230)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#d4bbff" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#d4bbff"/>
<text x="20" y="34" fill="#d4bbff" font-family="system-ui, sans-serif" font-size="21" font-weight="650">One persisted JSONL envelope</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">id: visible random request ID</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">nonce: Base64; ct: Base64 + GCM tag</text>
</g>
<g transform="translate(30 230)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#d4bbff" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#d4bbff"/>
<text x="20" y="34" fill="#d4bbff" font-family="system-ui, sans-serif" font-size="21" font-weight="650">Hospital persistent volume</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">vault.jsonl → append, flush, fsync</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Survives container recreation</text>
</g>
<g transform="translate(30 432)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">Authorized read in hospital</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Read ID, nonce and ciphertext</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Authenticate with ID and decrypt</text>
</g>
<g transform="translate(560 432)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">Secret lifecycle / separate</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">AES key outside Git, mounted read-only</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Paillier key: memory, regenerated</text>
</g>
</svg>
