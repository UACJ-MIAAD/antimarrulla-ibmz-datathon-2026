<text x="62" y="755" font-size="14" fill="#7045b7" text-anchor="start" font-weight="400">No SQL engine, patient table or CURP. The dashed reverse link is an in-memory decrypted view, not a foreign key. ID and nonce remain visible</text>
<text x="62" y="775" font-size="14" fill="#7045b7" text-anchor="start" font-weight="400">on disk.</text>
<text x="32" y="838" font-size="14" fill="#526780" text-anchor="start" font-weight="400">The hospital vault does not encrypt service audit files, operational logs, the complete VM disk or backups.</text>
