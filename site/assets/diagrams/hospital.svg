<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 848" role="img" aria-labelledby="title desc">
<title id="title">Hospital component</title><desc id="desc">The hospital owns plaintext validation, encryption, decryption, interpretation and encrypted storage. The browser is inside its trusted demo workflow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b8cd"/></marker></defs>
<rect width="1040" height="848" fill="#10141e" rx="16"/>
<path d="M480 104 H560" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M785 180 V230" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M560 306 H480" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M255 382 V432" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M480 508 H560" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M785 584 V634" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M560 710 H480" fill="none" stroke="#a8b8cd" stroke-width="2.4" marker-end="url(#arrow)"/>
<g transform="translate(30 28)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">1 / Serve UI and metadata</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">GET / and /api/synthetic</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">GET /api/state → service health</text>
</g>
<g transform="translate(560 28)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">2 / Receive synthetic evaluation</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">POST /api/evaluate</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Profile, random input or custom input</text>
</g>
<g transform="translate(560 230)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">3 / Validate original codes</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Exactly 21 integers in schema order</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Reject missing, extra or invalid values</text>
</g>
<g transform="translate(30 230)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">4 / Prepare encrypted request</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Generate a random 32-hex request ID</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Encrypt with hospital Paillier key</text>
</g>
<g transform="translate(30 432)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#78a9ff" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#78a9ff"/>
<text x="20" y="34" fill="#78a9ff" font-family="system-ui, sans-serif" font-size="21" font-weight="650">5 / Call the risk service</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Mutual TLS 1.3 and server verification</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">POST /v2/evaluate</text>
</g>
<g transform="translate(560 432)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">6 / Validate and decrypt response</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Match ID, model, schema and exponent</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Recover exact fixed-point integer</text>
</g>
<g transform="translate(560 634)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#d4bbff" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#d4bbff"/>
<text x="20" y="34" fill="#d4bbff" font-family="system-ui, sans-serif" font-size="21" font-weight="650">7 / Interpret and store</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Probability, threshold, contributions</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Save encrypted synthetic evaluation</text>
</g>
<g transform="translate(30 634)"><rect width="450" height="152" rx="12" fill="#1a2232" stroke="#6fdc8c" stroke-opacity=".6"/>
<rect x="0" y="16" width="4" height="120" rx="2" fill="#6fdc8c"/>
<text x="20" y="34" fill="#6fdc8c" font-family="system-ui, sans-serif" font-size="21" font-weight="650">8 / Return the UI result</text>
<text x="20" y="72" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Show ciphertext samples and risk</text>
<text x="20" y="102" fill="#e8edf5" font-family="system-ui, sans-serif" font-size="19">Show component timings</text>
</g>
</svg>
