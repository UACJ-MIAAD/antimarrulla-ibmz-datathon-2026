<text x="550" y="273" font-size="17" fill="#175cd3" text-anchor="middle" font-weight="650">HTTP request valid?</text>
<text x="550" y="297" font-size="15" fill="#526780" text-anchor="middle" font-weight="400">Route / size / content type</text>
</g>
