<text x="103" y="270" font-size="18" fill="#ba3544" text-anchor="start" font-weight="650">HTTP 404 / 413 / 415</text>
<text x="65" y="301" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Reject unsupported request</text>
</g>
