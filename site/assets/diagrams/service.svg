<text x="32" y="38" font-size="23" fill="#20344d" text-anchor="start" font-weight="700">Risk service / validation and encrypted scoring</text>
<text x="32" y="65" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Flowchart · TLS client authentication happens before HTTP request handling</text>
<path d="M32 83L1168 83" stroke="#d9e2ed" stroke-width="1.6" fill="none"/>
