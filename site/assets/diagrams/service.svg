<rect x="375" y="600" width="350" height="96" rx="10" fill="white" stroke="#175cd3" stroke-width="1.8"/>
<g transform="translate(393 619) scale(0.90625)" fill="none" stroke="#175cd3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="25" r="3"/><circle cx="17" cy="16" r="4"/><circle cx="27" cy="7" r="3"/><circle cx="27" cy="25" r="3"/><path d="M9 9l5 5M9 23l5-5m7-4 4-5m-4 9 4 5"/></g>
<text x="433" y="635" font-size="18" fill="#175cd3" text-anchor="start" font-weight="650">Homomorphic evaluator</text>
<text x="395" y="666" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Enc(z) = Enc(B + Σ Wᵢxᵢ)</text>
<text x="395" y="687" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Re-randomize the ciphertext</text>
</g>
