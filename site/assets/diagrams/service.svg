<text x="903" y="781" font-size="18" fill="#7045b7" text-anchor="start" font-weight="650">Capture wire evidence</text>
<text x="865" y="812" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Request + response bytes</text>
<text x="865" y="833" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Hashes + TLS metadata</text>
</g>
