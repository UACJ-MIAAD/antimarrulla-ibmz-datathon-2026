<text x="903" y="965" font-size="18" fill="#ba3544" text-anchor="start" font-weight="650">HTTP 503</text>
<text x="865" y="996" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Evidence storage failed</text>
</g>
<g class="node">
