<g transform="translate(63 444) scale(0.90625)" fill="none" stroke="#ba3544" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2l12 5v9c0 7-12 14-12 14S4 23 4 16V7zM10 15l4 4 8-9"/></g>
<text x="103" y="460" font-size="18" fill="#ba3544" text-anchor="start" font-weight="650">HTTP 400</text>
<text x="65" y="491" font-size="15" fill="#526780" text-anchor="start" font-weight="400">Invalid protocol/model</text>
</g>
