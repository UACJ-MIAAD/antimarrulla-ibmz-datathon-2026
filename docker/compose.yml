# Demo: two containers on one host. The host administrator remains trusted.
# Store secrets outside the repository; generate them with make secrets.
name: screening
services:
  service:
    build: { context: .., dockerfile: docker/Dockerfile, target: app }
    image: screening:demo
    command: ["python3", "-m", "screening.service"]
    user: "${SCREENING_UID:-10001}:${SCREENING_GID:-10001}"
    environment:
      SERVICE_CERT: /run/screening/service.pem
      SERVICE_KEY: /run/screening/service.key
      SERVICE_CLIENT_CA: /run/screening/ca.pem
    volumes:
      # Service TLS identity and CA only; no hospital Paillier or vault key.
      - ${SCREENING_SECRETS}/certs/service.pem:/run/screening/service.pem:ro
      - ${SCREENING_SECRETS}/certs/service.key:/run/screening/service.key:ro
      - ${SCREENING_SECRETS}/certs/ca.pem:/run/screening/ca.pem:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]
  hospital:
    image: screening:demo
    depends_on: [service]
    command: ["python3", "-m", "screening.hospital"]
    user: "${SCREENING_UID:-10001}:${SCREENING_GID:-10001}"
    environment:
      HOSPITAL_HOST: 0.0.0.0
      SERVICE_URL: https://service:8443
      TLS_CA: /run/screening/ca.pem
      TLS_CLIENT_CERT: /run/screening/hospital.pem
      TLS_CLIENT_KEY: /run/screening/hospital.key
      VAULT_KEY: /run/screening/vault.key
      VAULT_FILE: /var/lib/screening/vault.jsonl
    volumes:
      - ${SCREENING_SECRETS}/certs/ca.pem:/run/screening/ca.pem:ro
      - ${SCREENING_SECRETS}/certs/hospital.pem:/run/screening/hospital.pem:ro
      - ${SCREENING_SECRETS}/certs/hospital.key:/run/screening/hospital.key:ro
      - ${SCREENING_SECRETS}/vault.key:/run/screening/vault.key:ro
      - vault:/var/lib/screening
    ports: ["127.0.0.1:${SCREENING_UI_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]
networks:
  internal: {}
volumes:
  vault: {}
