<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Helvetica, Arial, sans-serif">
  <title>Privacy-preserving screening · implemented flow</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78a9ff" /></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#42be65" /></marker>
  </defs>
  <rect width="1400" height="820" fill="#0e0e13" />
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">Privacy-preserving screening · implemented flow</text>
  <text x="40" y="82" fill="#a3a3b5" font-size="16">Los Antimarrulla · IBM Z Datathon 2026 · src/screening/ · verified locally; LinuxONE s390x run pending</text>


  <rect x="40" y="110" width="1320" height="120" rx="14" fill="#17171f" stroke="#2a2a36" />
  <text x="60" y="140" fill="#a3a3b5" font-size="14" font-weight="700" letter-spacing="1">BEFORE THE DEMO (OFFLINE) · make model · make verify</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="60" y="155" width="230" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe" /><text x="175" y="179" text-anchor="middle">CDC UCI 891</text><text x="175" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">253,680 rows · 21 integer features</text>
    <rect x="330" y="155" width="230" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe" /><text x="445" y="179" text-anchor="middle">70/15/15 splits</text><text x="445" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">stratified · seed 2026</text>
    <rect x="600" y="155" width="250" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe" /><text x="725" y="179" text-anchor="middle">Logistic regression</text><text x="725" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">threshold selected on validation</text>
    <rect x="890" y="155" width="450" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe" /><text x="1115" y="179" text-anchor="middle">Exported model (cdc21-v1 schema)</text><text x="1115" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">W = round(10⁹·w) · B = round(10⁹·b) · exponent 0 · hashes</text>
  </g>
  <g stroke="#78a9ff" stroke-width="2" marker-end="url(#f)"><line x1="292" y1="183" x2="326" y2="183" /><line x1="562" y1="183" x2="596" y2="183" /><line x1="852" y1="183" x2="886" y2="183" /></g>


  <rect x="40" y="260" width="1320" height="470" rx="16" fill="none" stroke="#f1c21b" stroke-dasharray="10 8" stroke-width="2" />
  <text x="60" y="290" fill="#f1c21b" font-size="15" font-weight="700">PLANNED SAME-VM DEMO · trusted host administrator · SYNTHETIC demonstration patients only</text>


  <rect x="70" y="310" width="560" height="395" rx="14" fill="#13261a" stroke="#24a148" stroke-width="2" />
  <text x="90" y="342" fill="#42be65" font-size="19" font-weight="700">Hospital container · owns the private key</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="90" y="360" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="215" y="386" text-anchor="middle">1 · Split-screen UI</text><text x="215" y="407" text-anchor="middle" fill="#a3a3b5" font-size="13">synthetic patient (21 features)</text>
    <rect x="360" y="360" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="485" y="386" text-anchor="middle">2 · Validate schema</text><text x="485" y="407" text-anchor="middle" fill="#a3a3b5" font-size="13">reject values outside integer ranges</text>
    <rect x="360" y="440" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="485" y="466" text-anchor="middle">3 · Encrypt with Paillier</text><text x="485" y="487" text-anchor="middle" fill="#a3a3b5" font-size="13">2048-bit private key in memory</text>
    <rect x="90" y="540" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="215" y="566" text-anchor="middle">7 · Risk = σ(z / 10⁹)</text><text x="215" y="587" text-anchor="middle" fill="#a3a3b5" font-size="13">threshold + model contributions</text>
    <rect x="360" y="540" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="485" y="566" text-anchor="middle">6 · Decrypt integer z</text><text x="485" y="587" text-anchor="middle" fill="#a3a3b5" font-size="13">own pending responses, once only</text>
    <rect x="90" y="625" width="520" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="350" y="651" text-anchor="middle">8 · AES-256-GCM vault (unique nonce; ID as AAD)</text><text x="350" y="672" text-anchor="middle" fill="#a3a3b5" font-size="13">32-byte key outside repository · result returned to UI</text>
  </g>
  <g stroke="#42be65" stroke-width="2" marker-end="url(#g)"><line x1="342" y1="391" x2="356" y2="391" /><line x1="485" y1="424" x2="485" y2="436" /><line x1="358" y1="571" x2="344" y2="571" /><line x1="215" y1="604" x2="215" y2="621" /><line x1="485" y1="604" x2="485" y2="621" /></g>


  <rect x="790" y="310" width="540" height="395" rx="14" fill="#14203a" stroke="#0f62fe" stroke-width="2" />
  <text x="810" y="342" fill="#78a9ff" font-size="19" font-weight="700">Risk service container · no private key</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="810" y="370" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="1060" y="396" text-anchor="middle">4 · Validate message</text><text x="1060" y="417" text-anchor="middle" fill="#a3a3b5" font-size="13">versions, ≥2048-bit key, 21 group ciphertexts, overflow bound</text>
    <rect x="810" y="452" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="1060" y="478" text-anchor="middle">5 · Enc(z) = ∏ Enc(xᵢ)^Wᵢ · Enc(B)  (mod n²)</text><text x="1060" y="499" text-anchor="middle" fill="#a3a3b5" font-size="13">public weights only; rerandomize result</text>
    <rect x="810" y="534" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36" /><text x="1060" y="560" text-anchor="middle">Logs: IDs, milliseconds and byte counts</text><text x="1060" y="581" text-anchor="middle" fill="#a3a3b5" font-size="13">no input values or decrypted results</text>
    <text x="1060" y="640" text-anchor="middle" fill="#a3a3b5" font-size="14">Receives public key + 21 ciphertexts (≈27 KB)</text>
    <text x="1060" y="664" text-anchor="middle" fill="#a3a3b5" font-size="14">Returns one encrypted score (≈1.4 KB)</text>
  </g>
  <g stroke="#78a9ff" stroke-width="2" marker-end="url(#f)"><line x1="1060" y1="434" x2="1060" y2="448" /></g>


  <path d="M612 471 C 700 471, 700 401, 806 401" fill="none" stroke="#78a9ff" stroke-width="3" marker-end="url(#f)" />
  <path d="M806 483 C 700 483, 700 571, 612 571" fill="none" stroke="#78a9ff" stroke-width="3" marker-end="url(#f)" />
  <rect x="640" y="500" width="120" height="44" rx="8" fill="#0e0e13" stroke="#78a9ff" />
  <text x="700" y="519" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">TLS 1.3</text>
  <text x="700" y="536" text-anchor="middle" fill="#a3a3b5" font-size="12">mutual (mTLS)</text>

  <text x="40" y="762" fill="#a3a3b5" font-size="15">Tests: decrypted integer equals the reference · floating-point logit error ≤ 1.03×10⁻⁷ · negatives, zeros, extremes, invalid inputs ·</text><text x="40" y="784" fill="#a3a3b5" font-size="15">export/reload · no private key at the service · no patient data in operational service logs.</text>
  <text x="40" y="806" fill="#a3a3b5" font-size="15">Screening support, not diagnosis. ENSANUT and E5 are separate exploratory extras; Granite and CKKS are not implemented.</text>
</svg>
