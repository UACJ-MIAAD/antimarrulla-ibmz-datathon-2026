<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Helvetica, Arial, sans-serif">
  <title>Tamizaje a ciegas · flujo implementado</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78a9ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#42be65"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#0e0e13"/>
  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="700">Tamizaje a ciegas · flujo implementado</text>
  <text x="40" y="82" fill="#a3a3b5" font-size="16">Los Antimarrulla · IBM Z Datathon 2026 · código en src/tamizaje/ · probado en contenedores locales; en LinuxONE corre la misma imagen Ubuntu 24.04 (s390x)</text>

  <!-- Fuera de línea -->
  <rect x="40" y="110" width="1320" height="120" rx="14" fill="#17171f" stroke="#2a2a36"/>
  <text x="60" y="140" fill="#a3a3b5" font-size="14" font-weight="700" letter-spacing="1">ANTES DE LA DEMO (FUERA DE LÍNEA) · make modelo · make verify</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="60" y="155" width="230" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe"/><text x="175" y="179" text-anchor="middle">CDC UCI 891</text><text x="175" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">253,680 filas · 21 enteros</text>
    <rect x="330" y="155" width="230" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe"/><text x="445" y="179" text-anchor="middle">Particiones 70/15/15</text><text x="445" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">estratificadas · semilla 2026</text>
    <rect x="600" y="155" width="250" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe"/><text x="725" y="179" text-anchor="middle">Regresión logística</text><text x="725" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">umbral fijado en validación</text>
    <rect x="890" y="155" width="450" height="56" rx="10" fill="#1d2a45" stroke="#0f62fe"/><text x="1115" y="179" text-anchor="middle">Modelo exportado (esquema cdc21-v1)</text><text x="1115" y="199" text-anchor="middle" fill="#a3a3b5" font-size="13">W = round(10⁹·w) · B = round(10⁹·b) · exponente 0 · hashes</text>
  </g>
  <g stroke="#78a9ff" stroke-width="2" marker-end="url(#f)"><line x1="292" y1="183" x2="326" y2="183"/><line x1="562" y1="183" x2="596" y2="183"/><line x1="852" y1="183" x2="886" y2="183"/></g>

  <!-- Frontera de confianza -->
  <rect x="40" y="260" width="1320" height="470" rx="16" fill="none" stroke="#f1c21b" stroke-dasharray="10 8" stroke-width="2"/>
  <text x="60" y="290" fill="#f1c21b" font-size="15" font-weight="700">MISMA VM (en LinuxONE) · quien la administra queda dentro del entorno de confianza · solo pacientes SINTÉTICOS</text>

  <!-- Hospital -->
  <rect x="70" y="310" width="560" height="395" rx="14" fill="#13261a" stroke="#24a148" stroke-width="2"/>
  <text x="90" y="342" fill="#42be65" font-size="19" font-weight="700">Contenedor del hospital · tiene la llave privada</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="90" y="360" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="215" y="386" text-anchor="middle">1 · UI pantalla dividida</text><text x="215" y="407" text-anchor="middle" fill="#a3a3b5" font-size="13">paciente sintético (21 variables)</text>
    <rect x="360" y="360" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="485" y="386" text-anchor="middle">2 · Validar esquema</text><text x="485" y="407" text-anchor="middle" fill="#a3a3b5" font-size="13">21 enteros en rango, o se rechaza</text>
    <rect x="360" y="440" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="485" y="466" text-anchor="middle">3 · Cifrar con Paillier</text><text x="485" y="487" text-anchor="middle" fill="#a3a3b5" font-size="13">llave de 2048 bits en memoria</text>
    <rect x="90" y="540" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="215" y="566" text-anchor="middle">7 · Riesgo = σ(z / 10⁹)</text><text x="215" y="587" text-anchor="middle" fill="#a3a3b5" font-size="13">umbral + factores que más pesan</text>
    <rect x="360" y="540" width="250" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="485" y="566" text-anchor="middle">6 · Descifrar z (entero)</text><text x="485" y="587" text-anchor="middle" fill="#a3a3b5" font-size="13">solo respuestas propias, una vez</text>
    <rect x="90" y="625" width="520" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="350" y="651" text-anchor="middle">8 · Bóveda AES-256-GCM (nonce único, id como AAD)</text><text x="350" y="672" text-anchor="middle" fill="#a3a3b5" font-size="13">llave de 32 bytes fuera del repositorio · resultado a la UI</text>
  </g>
  <g stroke="#42be65" stroke-width="2" marker-end="url(#g)"><line x1="342" y1="391" x2="356" y2="391"/><line x1="485" y1="424" x2="485" y2="436"/><line x1="358" y1="571" x2="344" y2="571"/><line x1="215" y1="604" x2="215" y2="621"/><line x1="485" y1="604" x2="485" y2="621"/></g>

  <!-- Servicio -->
  <rect x="790" y="310" width="540" height="395" rx="14" fill="#14203a" stroke="#0f62fe" stroke-width="2"/>
  <text x="810" y="342" fill="#78a9ff" font-size="19" font-weight="700">Contenedor del servicio de riesgo · sin llave privada</text>
  <g font-size="15" fill="#e8e8ef">
    <rect x="810" y="370" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="1060" y="396" text-anchor="middle">4 · Validar mensaje</text><text x="1060" y="417" text-anchor="middle" fill="#a3a3b5" font-size="13">versiones, llave ≥ 2048 bits, 21 cifrados en el grupo, cota de desbordamiento</text>
    <rect x="810" y="452" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="1060" y="478" text-anchor="middle">5 · Enc(z) = ∏ Enc(xᵢ)^Wᵢ · Enc(B)  (mod n²)</text><text x="1060" y="499" text-anchor="middle" fill="#a3a3b5" font-size="13">solo pesos públicos; re-aleatoriza el resultado</text>
    <rect x="810" y="534" width="500" height="62" rx="10" fill="#17171f" stroke="#2a2a36"/><text x="1060" y="560" text-anchor="middle">Logs: id, milisegundos y bytes</text><text x="1060" y="581" text-anchor="middle" fill="#a3a3b5" font-size="13">nunca entradas ni resultados</text>
    <text x="1060" y="640" text-anchor="middle" fill="#a3a3b5" font-size="14">Recibe solo: llave pública + 21 cifrados (≈ 27 KB)</text>
    <text x="1060" y="664" text-anchor="middle" fill="#a3a3b5" font-size="14">Devuelve solo: puntaje cifrado (≈ 1.4 KB)</text>
  </g>
  <g stroke="#78a9ff" stroke-width="2" marker-end="url(#f)"><line x1="1060" y1="434" x2="1060" y2="448"/></g>

  <!-- TLS -->
  <path d="M612 471 C 700 471, 700 401, 806 401" fill="none" stroke="#78a9ff" stroke-width="3" marker-end="url(#f)"/>
  <path d="M806 483 C 700 483, 700 571, 612 571" fill="none" stroke="#78a9ff" stroke-width="3" marker-end="url(#f)"/>
  <rect x="640" y="500" width="120" height="44" rx="8" fill="#0e0e13" stroke="#78a9ff"/>
  <text x="700" y="519" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">TLS 1.3</text>
  <text x="700" y="536" text-anchor="middle" fill="#a3a3b5" font-size="12">mutuo (mTLS)</text>

  <text x="40" y="762" fill="#a3a3b5" font-size="15">Pruebas: entero descifrado idéntico a la referencia · error vs. flotante ≤ 1.03×10⁻⁷ en el logit · negativos, ceros, extremos y entradas inválidas ·</text><text x="40" y="784" fill="#a3a3b5" font-size="15">exportar y recargar · el servicio no tiene la llave privada y no registra datos de pacientes.</text>
  <text x="40" y="806" fill="#a3a3b5" font-size="15">Tamizaje, no diagnóstico. La explicación con Granite, ENSANUT, el pronóstico E5 y CKKS son extras (ver site/status.json).</text>
</svg>
